<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#fff0f0">
  <meta name="color-scheme" content="light">
  <title>403 — Access denied | FILIP OSCAR</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="preload" href="lib/fonts/MonospaceTypewriter-webfont.woff2" as="font" type="font/woff2" crossorigin>
  <style>
@font-face{font-family:"monospacetypewriterregular";src:url("/lib/fonts/MonospaceTypewriter-webfont.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
:root{--paper:#fff0f0;--ink:#29191a;--accent:#ab3046;--line:#e6d7d6;--typewriter:"monospacetypewriterregular","Courier New",monospace}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 Arial,Helvetica,sans-serif;min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
a{color:inherit;text-underline-offset:5px}a:hover{color:var(--accent)}a:focus-visible{outline:3px solid var(--accent);outline-offset:6px}
header,main,footer{width:min(100% - 40px,1088px);margin-inline:auto}header{padding-block:22px;border-bottom:1px solid var(--line)}
.wordmark{font:700 28px/1.2 var(--typewriter);text-decoration:none}main{flex:1;display:grid;align-content:center;padding-block:64px}
.code{margin:0;color:var(--accent);font:700 clamp(80px,18vw,180px)/1.1 var(--typewriter)}
h1{font-size:clamp(30px,5vw,54px);line-height:1.15;letter-spacing:-.035em;margin:24px 0 16px}
.message{max-width:48ch;margin:0}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:20px;margin-top:32px}
.button{display:inline-flex;align-items:center;gap:24px;min-height:50px;padding:12px 22px;background:var(--ink);color:var(--paper);font:12px/1.65 var(--typewriter);text-decoration:none;transition:background-color .2s ease,color .2s ease}
.button:hover{background:var(--accent);color:white}.contact{font:12px/1.65 var(--typewriter)}
footer{padding-block:24px;border-top:1px solid var(--line);font:11px/1.65 var(--typewriter)}
@media(prefers-reduced-motion:reduce){.button{transition:none}}
  </style>
</head>
<body>
  <header><a class="wordmark" href="/" aria-label="FILIP OSCAR home">FILIP OSCAR</a></header>
  <main>
    <p class="code">403<span hidden> — Access denied</span></p>
    <h1>This page is out of reach.</h1>
    <p class="message">You don’t have permission to open this page. There’s still plenty to listen to on the homepage.</p>
    <div class="actions">
      <a class="button" href="/">Back to the music <span aria-hidden="true">↗</span></a>
      <a class="contact" href="mailto:hello@filiposcar.com">Get in touch</a>
    </div>
  </main>
  <footer>FILIP OSCAR · Songs. Sounds. Stories.</footer>
</body>
</html>
